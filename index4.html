<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<tittle>StyleSphere - Contact</tittle>
	<style>
    	body { background-color: #F8F0EC; color: #493735; font-family: Arial; }
    	header, footer { background-color: #493735; color: white; text-align: center; padding: 15px; }
    	nav { text-align: center; background-color: #E8D9D0; padding: 10px; }
    	a { color: #493735; margin: 8px; }
    	main { background-color: white; padding: 15px; }
    	input, textarea { display: block; margin: 8px 0; padding: 8px; }
	</style>
</head>
<body>
<header>
	<h1>Contact Us</h1>
	<p>We would love to hear from you.</p>
</header>
<nav>
	<a href="index.html">Home</a>
	<a href="trends.html">Trends</a>
	<a href="styleguide.html">Style Guide</a>
	<a href="contact.html">Contact</a>
</nav>
<main>
      <section>
    	<h2>Get in Touch</h2>
    	<form>
        	<label for="name">Name:</label>
        	<input type="text" id="name" required>
        	<label for="email">Email:</label>
        	<input type="email" id="email" required>
        	<label for="message">Message:</label>
        	<textarea id="message" rows="4" required></textarea>
        	<button type="submit">Send Message</button>
    	</form>
    	<p>Email: stylesphere@example.com</p>
      </section>
</main>
<footer>
	<p>2026 StyleSphere</p>
</footer>
</body>
</html>
